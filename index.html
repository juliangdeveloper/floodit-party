<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flood-It Party</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--panel:#1a1a2e;--panel2:#16213e;--accent:#e94560;--text:#e8e8e8;--dim:#888;--cell-border:#2c3e50}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;padding:16px}.screen.active{display:flex;flex-direction:column;align-items:center}
#menu{justify-content:center;text-align:center}
#menu h1{font-size:2.4em;margin-bottom:4px;background:linear-gradient(135deg,#e74c3c,#3498db,#2ecc71,#f1c40f,#9b59b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#menu .sub{color:var(--dim);margin-bottom:20px;font-size:.95em}
.ms{background:var(--panel);border-radius:16px;padding:16px;margin:8px 0;max-width:500px;width:100%}
.ms h3{color:var(--accent);margin-bottom:10px;font-size:.95em}
.pr{display:flex;align-items:center;gap:6px;margin:5px 0;padding:7px;background:rgba(255,255,255,.04);border-radius:8px}
.pr label{min-width:40px;font-weight:700;font-size:.9em}
.pr input[type=text]{flex:1;padding:5px 8px;border-radius:6px;border:1px solid #333;background:#0d1b2a;color:#fff;min-width:0;font-size:.9em}
.pr select{padding:5px;border-radius:6px;border:1px solid #333;background:#0d1b2a;color:#fff;font-size:.85em}
.btn{padding:10px 28px;border:none;border-radius:10px;font-size:1em;font-weight:700;cursor:pointer;transition:all .2s}
.btn-p{background:linear-gradient(135deg,var(--accent),#d93a7a);color:#fff}
.btn-p:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(233,69,96,.4)}
.btn-s{background:#333;color:#fff}.btn-s:hover{background:#444}
.btn-sm{padding:6px 14px;font-size:.8em}
.bg{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.cbtn{width:42px;height:42px;border-radius:50%;border:2px solid #444;background:transparent;color:#fff;font-size:1.1em;cursor:pointer;transition:all .2s}
.cbtn.on{border-color:var(--accent);background:var(--accent)}
.pcb{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.pcb label{font-size:.85em;color:var(--dim);cursor:pointer;padding:4px 10px;border-radius:8px;border:2px solid #333;transition:all .2s}
.pcb label:has(input:checked){border-color:var(--accent);background:rgba(233,69,96,.15)}
.pcb input{display:none}
.toggle-row{display:flex;align-items:center;gap:10px;margin:6px 0;justify-content:center}
.toggle-row label.toggle-label{font-size:.85em;color:var(--dim);cursor:pointer}
.toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#333;border-radius:12px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#888;border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:var(--accent)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(20px);background:#fff}

/* GAME */
#game{padding:8px;width:100%}
.g-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding:0 4px;margin-bottom:6px}
.round-badge{background:var(--panel2);padding:6px 14px;border-radius:12px;font-weight:700;font-size:1em}
.turn-badge{padding:6px 16px;border-radius:10px;font-weight:700;font-size:1em;transition:all .3s}

/* BOARD */
.board-wrap{display:flex;justify-content:center;margin:8px 0;overflow-x:auto}
.board{display:grid;gap:1px;background:var(--cell-border);border-radius:8px;padding:2px;touch-action:manipulation}
.cell{width:30px;height:30px;border-radius:4px;transition:all .15s;position:relative;display:flex;align-items:center;justify-content:center}
.cell.newcap{animation:newCap .4s ease-out}
@keyframes newCap{0%{transform:scale(.6);filter:brightness(3)}60%{transform:scale(1.15);filter:brightness(1.6)}100%{transform:scale(1);filter:brightness(1)}}
.corner{outline:3px solid rgba(255,255,255,.85);outline-offset:-1px;z-index:3}

/* WALL CELLS */
.cell.wall{background:#2c2c3a!important;box-shadow:inset 2px 2px 4px rgba(0,0,0,.6),inset -1px -1px 3px rgba(80,80,100,.3);border:1px solid #1a1a28}
.cell.wall::after{content:'🧱';font-size:10px;opacity:.5;position:absolute}

/* POWER-UP CELLS */
.cell.powerup{position:relative}
.cell.powerup::before{content:'';position:absolute;inset:1px;border-radius:3px;border:2px solid;opacity:.7;pointer-events:none;animation:puGlow 1.5s ease-in-out infinite alternate}
@keyframes puGlow{0%{opacity:.4;filter:brightness(1)}100%{opacity:.9;filter:brightness(1.3)}}
.cell .pu-icon{font-size:12px;position:relative;z-index:2;filter:drop-shadow(0 0 2px rgba(0,0,0,.8))}

/* Wave capture animation */
.cell.capturing{animation:captureRipple .5s cubic-bezier(.25,.46,.45,.94)}
@keyframes captureRipple{0%{transform:scale(.3);filter:brightness(.2)}50%{transform:scale(1.2);filter:brightness(3)}100%{transform:scale(1);filter:brightness(1)}}

/* Frozen player indicator */
.pb.frozen{background:rgba(100,200,255,.2)!important;border-color:#64c8ff!important}
.pb.frozen::after{content:' ❄️'}

/* Explosion ripple */
.explosion{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,rgba(255,100,0,.8),rgba(255,50,0,.3),transparent);animation:explode .5s ease-out forwards;pointer-events:none;z-index:10}
@keyframes explode{0%{transform:scale(0);opacity:1}100%{transform:scale(3);opacity:0}}

/* Bomb particle explosion */
.bomb-particle{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:12;animation:particleFly .7s ease-out forwards}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}

/* Screen shake */
@keyframes screenShake{0%,100%{transform:translate(0)}10%{transform:translate(-4px,2px)}20%{transform:translate(4px,-2px)}30%{transform:translate(-3px,3px)}40%{transform:translate(3px,-1px)}50%{transform:translate(-2px,2px)}60%{transform:translate(2px,-3px)}70%{transform:translate(-1px,1px)}80%{transform:translate(1px,-1px)}90%{transform:translate(-1px,0)}}
.shake{animation:screenShake .5s ease-out}

/* Freeze snowflakes */
.snowflake{position:absolute;font-size:20px;pointer-events:none;z-index:50;animation:snowfall 2s ease-in forwards}
@keyframes snowfall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(80px) rotate(360deg)}}

/* Steal lightning flash */
.lightning-flash{position:fixed;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,20,147,.5) 30%,rgba(255,255,255,.9) 50%,rgba(255,20,147,.5) 70%,transparent 100%);pointer-events:none;z-index:90;animation:lightningBolt .4s ease-out forwards}
@keyframes lightningBolt{0%{opacity:1;clip-path:inset(0 100% 0 0)}30%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}

/* Double glow pulse on player bar */
.pb.double-active{animation:doublePulse 0.6s ease-in-out infinite alternate}
@keyframes doublePulse{0%{box-shadow:0 0 6px rgba(255,215,0,.3)}100%{box-shadow:0 0 18px rgba(255,215,0,.8),0 0 30px rgba(255,215,0,.4)}}

/* Steal swipe */
.swipe{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,0,100,.6),transparent);animation:swipeAnim .4s ease-out forwards;pointer-events:none;z-index:10}
@keyframes swipeAnim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* COLOR PICKER */
.picker{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.pbtn{width:44px;height:44px;border-radius:50%;border:3px solid #333;cursor:pointer;transition:all .15s}
.pbtn:hover{transform:scale(1.15);border-color:#fff}
.pbtn:disabled{opacity:.35;cursor:default;transform:none;border-color:#333}

/* PLAYERS */
.player-bar{display:flex;gap:8px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.pb{padding:6px 14px;border-radius:10px;font-weight:700;font-size:.85em;border:2px solid transparent;transition:all .3s;opacity:.55}
.pb.current{opacity:1;transform:scale(1.1);box-shadow:0 0 12px rgba(255,255,255,.15)}
.pb .pb-score{margin-left:6px;font-size:.95em}
.pb .pct{display:block;font-size:.68em;font-weight:600;opacity:.8}
.pb .pb-effects{display:inline;margin-left:4px;font-size:.85em}

/* SCORE POP */
.score-pop{position:fixed;pointer-events:none;font-size:1.5em;font-weight:900;z-index:100;text-shadow:0 2px 8px rgba(0,0,0,.8);animation:popUp .8s ease-out forwards}
@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(1.4)}}

.msg{background:rgba(233,69,96,.12);border:1px solid var(--accent);border-radius:10px;padding:8px 16px;text-align:center;font-weight:600;font-size:.9em;margin-top:8px;max-width:700px;width:100%}

/* OVERLAYS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.overlay-card{background:var(--panel);border-radius:20px;padding:24px;max-width:520px;width:100%;text-align:center;border:2px solid var(--accent);max-height:85vh;overflow-y:auto}
.overlay-card h2{font-size:1.2em;margin-bottom:8px}
.overlay-card p{margin:8px 0;line-height:1.5;font-size:.9em}
.overlay-card .paper-box{background:var(--panel2);border-radius:12px;padding:14px;margin:10px 0;text-align:left;font-size:.85em;line-height:1.6;border-left:3px solid var(--accent)}
.overlay-card .theorem{background:rgba(233,69,96,.1);border-left:3px solid var(--accent);padding:10px;margin:8px 0;font-size:.85em;border-radius:0 8px 8px 0;font-style:italic}
.overlay-card ul{text-align:left;padding-left:20px;margin:8px 0;font-size:.9em;line-height:1.7}

/* END */
#end{text-align:center;padding-top:20px}
#end h1{font-size:2.2em;margin-bottom:8px;background:linear-gradient(135deg,#e74c3c,#3498db,#2ecc71);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.end-rank{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-radius:12px;margin:5px 0;max-width:450px}
.end-rank.w{border:2px solid #f5a623}
.er-pos{font-size:1.4em;width:36px}
.er-name{flex:1;text-align:left;font-weight:600}
.er-score{font-weight:700;color:var(--accent)}
</style>
</head>
<body>

<div id="menu" class="screen active">
  <h1>🌊 Flood-It Party</h1>
  <p class="sub">Inunda tu esquina · Captura territorio · ¡Conquista el tablero!</p>
  <div class="ms">
    <h3>Jugadores</h3>
    <div class="pcb"><button class="cbtn on" onclick="setPC(2)">2</button><button class="cbtn" onclick="setPC(3)">3</button><button class="cbtn" onclick="setPC(4)">4</button></div>
    <div id="pSetup"></div>
  </div>
  <div class="ms">
    <h3>Colores (dificultad)</h3>
    <div class="pcb">
      <label><input type="radio" name="col" value="4"> 4</label>
      <label><input type="radio" name="col" value="5" checked> 5</label>
      <label><input type="radio" name="col" value="6"> 6</label>
    </div>
  </div>
  <div class="ms">
    <h3>Tablero</h3>
    <div class="pcb">
      <label><input type="radio" name="bsz" value="small"> Pequeño (10×8)</label>
      <label><input type="radio" name="bsz" value="med" checked> Mediano (14×11)</label>
      <label><input type="radio" name="bsz" value="big"> Grande (18×14)</label>
    </div>
  </div>
  <div class="ms">
    <h3>Celdas Especiales</h3>
    <div class="toggle-row">
      <label class="toggle-label">Celdas especiales</label>
      <div class="toggle-switch"><input type="checkbox" id="specialToggle" checked><span class="toggle-slider" onclick="this.previousElementSibling.click()"></span></div>
    </div>
    <div id="wallDensityWrap">
      <p style="font-size:.8em;color:var(--dim);margin:8px 0 4px">Densidad de muros</p>
      <div class="pcb">
        <label><input type="radio" name="wdens" value="0"> Ninguno</label>
        <label><input type="radio" name="wdens" value="5"> Pocos (5%)</label>
        <label><input type="radio" name="wdens" value="8" checked> Algunos (8%)</label>
        <label><input type="radio" name="wdens" value="12"> Muchos (12%)</label>
      </div>
    </div>
  </div>
  <div class="bg">
    <button class="btn btn-p" onclick="startG()">🎲 Jugar</button>
    <button class="btn btn-s" onclick="showAbout()">📄 El Paper</button>
    <button class="btn btn-s" onclick="showRules()">📜 Reglas</button>
  </div>
</div>

<div id="game" class="screen">
  <div class="g-top">
    <div class="round-badge" id="turnCount">Turno 1</div>
    <div class="turn-badge" id="turnBadge">Turno</div>
    <div style="display:flex;gap:4px">
      <button class="btn btn-s btn-sm" onclick="showAbout()">📄</button>
      <button class="btn btn-s btn-sm" onclick="showRules()">📜</button>
    </div>
  </div>
  <div class="player-bar" id="playerBar"></div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="picker" id="picker"></div>
  <div class="msg" id="msg">Preparando...</div>
</div>

<div id="end" class="screen">
  <h1>🏆 ¡Territorio Conquistado!</h1>
  <div id="endRank"></div>
  <div class="bg">
    <button class="btn btn-p" onclick="showS('menu')">🏠 Menú</button>
    <button class="btn btn-s" onclick="startG()">🔄 Revancha</button>
  </div>
</div>

<div class="overlay" id="rulesOv"><div class="overlay-card" id="rulesCard"></div></div>
<div class="overlay" id="aboutOv"><div class="overlay-card" id="aboutCard"></div></div>

<script>
// Tablero base (no cambia); owner[r][c] = índice de jugador o -1 si libre
const PALETTE=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22'];
const COLOR_NAMES=['Rojo','Azul','Verde','Amarillo','Morado','Naranja'];
const PCOL=['#2dd4bf','#f97316','#ec4899','#84cc16'];
const CORNERS=[[0,0],[-1,-1],[0,-1],[-1,0]]; // según nº jugadores se toman las primeras

// Power-up definitions
const PU_TYPES=['bomb','freeze','steal','double'];
const PU_DIST=[0.35,0.30,0.20,0.15]; // cumulative not needed, just weights
const PU_EMOJI={bomb:'💣',freeze:'❄️',steal:'⚡',double:'🔄'};
const PU_GLOW={bomb:'#ff4500',freeze:'#64c8ff',steal:'#ff1493',double:'#ffd700'};

let G={grid:[],owner:[],cellType:[],powerupType:[],rows:11,cols:14,colors:5,players:[],curP:0,turns:0,animating:false,over:false,stall:0,specialEnabled:true,wallPct:8,wallCount:0};

// ===================== SETUP =====================
function setPC(n){document.querySelectorAll('#menu .cbtn').forEach((b,i)=>b.classList.toggle('on',i===n-2));renderPS(n)}
function renderPS(n){let h='';for(let i=0;i<n;i++)h+=`<div class="pr"><label style="color:${PCOL[i]}">P${i+1}</label><input type="text" id="pn${i}" placeholder="Jugador ${i+1}" maxlength="10"><select id="pt${i}"><option value="human">Humano</option><option value="easy">IA Fácil</option><option value="medium">IA Media</option><option value="hard">IA Difícil</option></select></div>`;document.getElementById('pSetup').innerHTML=h}
function getPC(){const a=document.querySelector('#menu .cbtn.on');return a?parseInt(a.textContent):2}
function getCol(){return parseInt(document.querySelector('input[name=col]:checked')?.value||5)}
function getBoardSize(){const v=document.querySelector('input[name=bsz]:checked')?.value||'med';return v==='small'?{c:10,r:8}:v==='big'?{c:18,r:14}:{c:14,r:11}}

// Toggle wall density visibility
document.getElementById('specialToggle').addEventListener('change',function(){
  document.getElementById('wallDensityWrap').style.display=this.checked?'block':'none';
});

// ===================== START =====================
function startG(){
  const n=getPC();const bs=getBoardSize();
  G.cols=bs.c;G.rows=bs.r;G.colors=getCol();G.turns=0;G.over=false;G.animating=false;G.stall=0;
  G.specialEnabled=document.getElementById('specialToggle').checked;
  G.wallPct=parseInt(document.querySelector('input[name=wdens]:checked')?.value||'8');
  G.wallCount=0;
  G.players=[];
  for(let i=0;i<n;i++){
    const nm=document.getElementById(`pn${i}`)?.value.trim()||`Jugador ${i+1}`;
    const tp=document.getElementById(`pt${i}`)?.value||'human';
    G.players.push({name:nm,type:tp,color:PCOL[i],terr:0,big:0,frozenTurns:0,doubleReady:false,totalCaptured:0});
  }
  generateBoard();
  G.curP=0;
  renderAll();
  startTurn();
  showS('game');
}

// ===================== BOARD GENERATION =====================
function generateBoard(){
  G.grid=[];G.owner=[];G.cellType=[];G.powerupType=[];G.wallCount=0;

  // Generate colors
  for(let r=0;r<G.rows;r++){
    G.grid[r]=[];G.owner[r]=[];G.cellType[r]=[];G.powerupType[r]=[];
    for(let c=0;c<G.cols;c++){
      G.grid[r][c]=Math.floor(Math.random()*G.colors);
      G.owner[r][c]=-1;
      G.cellType[r][c]='normal';
      G.powerupType[r][c]=null;
    }
  }

  // Place corners first
  const cornerCells=new Set();
  for(let i=0;i<G.players.length;i++){
    const [rr,cc]=corner(i);
    cornerCells.add(rr*1000+cc);
  }

  // Place walls if special cells enabled
  if(G.specialEnabled && G.wallPct>0){
    const totalCells=G.rows*G.cols;
    const targetWalls=Math.floor(totalCells*G.wallPct/100);
    const candidates=[];

    // Collect candidate cells (not corners)
    for(let r=0;r<G.rows;r++){
      for(let c=0;c<G.cols;c++){
        if(!cornerCells.has(r*1000+c)){
          candidates.push([r,c]);
        }
      }
    }

    // Shuffle candidates
    shuffle(candidates);

    let placed=0;
    for(const [r,c] of candidates){
      if(placed>=targetWalls)break;
      // Temporarily place wall
      G.cellType[r][c]='wall';
      G.wallCount++;

      // Check connectivity: all corners must still be reachable from each other via non-wall cells
      if(!checkBoardConnectivity(cornerCells)){
        // Undo wall placement
        G.cellType[r][c]='normal';
        G.wallCount--;
      }else{
        placed++;
      }
    }
  }

  // Place power-ups on remaining normal, non-corner cells
  if(G.specialEnabled){
    const puCandidates=[];
    for(let r=0;r<G.rows;r++){
      for(let c=0;c<G.cols;c++){
        if(G.cellType[r][c]==='normal'&&!cornerCells.has(r*1000+c)){
          puCandidates.push([r,c]);
        }
      }
    }
    shuffle(puCandidates);
    const puTarget=Math.floor((G.rows*G.cols-G.wallCount)*0.05);
    for(let i=0;i<Math.min(puTarget,puCandidates.length);i++){
      const[r,c]=puCandidates[i];
      G.cellType[r][c]='powerup';
      G.powerupType[r][c]=pickPUType();
    }
  }

  // Assign corners to players
  for(let i=0;i<G.players.length;i++){
    const [rr,cc]=corner(i);
    G.owner[rr][cc]=i;
  }
}

function pickPUType(){
  const r=Math.random();
  let cum=0;
  for(let i=0;i<PU_DIST.length;i++){
    cum+=PU_DIST[i];
    if(r<cum)return PU_TYPES[i];
  }
  return PU_TYPES[PU_TYPES.length-1];
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

// BFS connectivity check: verify all corner cells can reach each other
function checkBoardConnectivity(cornerCells){
  const corners=[...cornerCells];
  if(corners.length<=1)return true;

  // BFS from first corner
  const start=corners[0];
  const sr=Math.floor(start/1000),sc=start%1000;
  const visited=bfsNonWall(sr,sc);

  // All other corners must be reachable
  for(let i=1;i<corners.length;i++){
    const key=corners[i];
    if(!visited.has(key))return false;
  }
  return true;
}

function bfsNonWall(sr,sc){
  const visited=new Set();
  const queue=[[sr,sc]];
  visited.add(sr*1000+sc);
  while(queue.length){
    const[r,c]=queue.shift();
    for(const[nr,nc]of nbors(r,c)){
      const key=nr*1000+nc;
      if(visited.has(key))continue;
      if(G.cellType[nr][nc]==='wall')continue;
      visited.add(key);
      queue.push([nr,nc]);
    }
  }
  return visited;
}

function corner(i){
  const n=G.players.length;
  if(n===2)return i===0?[0,0]:[G.rows-1,G.cols-1];
  if(n===3)return i===0?[0,0]:i===1?[G.rows-1,G.cols-1]:[0,G.cols-1];
  return i===0?[0,0]:i===1?[G.rows-1,G.cols-1]:i===2?[0,G.cols-1]:[G.rows-1,0];
}

// ===================== CORE: FLOOD CAPTURE =====================
// Captura en una copia de owner (para simulación). Devuelve {list:[[r,c]...], n, powerups:[puType...], waves:[[cells_at_dist_1],[dist_2],...]}
function doCapture(owner,p,color){
  const captured=[];
  const capturedPowerups=[];
  const waves=[];
  const visited=new Set();
  const frontier=[];
  // sembrar desde el territorio actual del jugador
  for(let r=0;r<G.rows;r++){
    for(let c=0;c<G.cols;c++){
      if(owner[r][c]!==p)continue;
      for(const[nr,nc]of nbors(r,c)){
        const key=nr*1000+nc;
        if(visited.has(key)||owner[nr][nc]!==-1||G.grid[nr][nc]!==color)continue;
        // Skip walls
        if(G.cellType[nr][nc]==='wall')continue;
        visited.add(key);frontier.push([nr,nc]);
      }
    }
  }
  while(frontier.length){
    const wave=[];
    const nextFrontier=[];
    for(const [r,c] of frontier){
      wave.push([r,c]);
      captured.push([r,c]);
      owner[r][c]=p;
      // Check if this cell is a power-up
      if(G.cellType[r][c]==='powerup'&&G.powerupType[r][c]){
        capturedPowerups.push({r,c,type:G.powerupType[r][c]});
      }
      for(const[nr,nc]of nbors(r,c)){
        const key=nr*1000+nc;
        if(visited.has(key)||owner[nr][nc]!==-1||G.grid[nr][nc]!==color)continue;
        if(G.cellType[nr][nc]==='wall')continue;
        visited.add(key);nextFrontier.push([nr,nc]);
      }
    }
    if(wave.length>0)waves.push(wave);
    frontier.length=0;
    for(const f of nextFrontier)frontier.push(f);
  }
  return {list:captured,n:captured.length,powerups:capturedPowerups,waves};
}


function nbors(r,c){
  const a=[];
  if(r>0)a.push([r-1,c]);
  if(r<G.rows-1)a.push([r+1,c]);
  if(c>0)a.push([r,c-1]);
  if(c<G.cols-1)a.push([r,c+1]);
  return a;
}

// ===================== POWER-UP EFFECTS =====================
async function processPowerups(pIdx,puList){
  const p=G.players[pIdx];
  for(const pu of puList){
    // Mark power-up as consumed (remove from board)
    G.cellType[pu.r][pu.c]='normal';
    G.powerupType[pu.r][pu.c]=null;

    if(pu.type==='bomb'){
      await doBomb(pIdx);
    }else if(pu.type==='freeze'){
      doFreeze(pIdx);
    }else if(pu.type==='steal'){
      await doSteal(pIdx);
    }else if(pu.type==='double'){
      doDouble(pIdx);
    }
  }
}

async function doBomb(pIdx){
  // Capture 3 random free cells adjacent to player territory
  const adjFree=[];
  for(let r=0;r<G.rows;r++){
    for(let c=0;c<G.cols;c++){
      if(G.owner[r][c]!==pIdx)continue;
      for(const[nr,nc]of nbors(r,c)){
        if(G.owner[nr][nc]===-1&&G.cellType[nr][nc]!=='wall'){
          adjFree.push([nr,nc]);
        }
      }
    }
  }
  shuffle(adjFree);
  const toCapture=adjFree.slice(0,3);

  // Screen shake
  const boardWrap=document.querySelector('.board-wrap');
  if(boardWrap){boardWrap.classList.add('shake');setTimeout(()=>boardWrap.classList.remove('shake'),500)}

  for(const[r,c]of toCapture){
    G.owner[r][c]=pIdx;
    // Animate explosion + particle burst
    const el=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if(el){
      const exp=document.createElement('div');
      exp.className='explosion';
      el.appendChild(exp);
      setTimeout(()=>exp.remove(),500);

      // 8 particle divs radiating outward
      const colors=['#ff4500','#ff6347','#ffa500','#ffd700','#ff1493','#ff0000','#ff8c00','#ffff00'];
      for(let i=0;i<8;i++){
        const particle=document.createElement('div');
        particle.className='bomb-particle';
        const angle=(i/8)*Math.PI*2;
        const dist=30+Math.random()*20;
        particle.style.setProperty('--dx',`${Math.cos(angle)*dist}px`);
        particle.style.setProperty('--dy',`${Math.sin(angle)*dist}px`);
        particle.style.background=colors[i];
        particle.style.left='11px';
        particle.style.top='11px';
        el.appendChild(particle);
        setTimeout(()=>particle.remove(),700);
      }
    }
  }
  if(toCapture.length>0){
    G.players[pIdx].totalCaptured+=toCapture.length;
    setMsg(`💣 ¡${G.players[pIdx].name} usa Bomba! +${toCapture.length} casillas`);
    await sleep(600);
  }
}

function doFreeze(pIdx){
  // Pick a random OTHER player to freeze
  const others=[];
  for(let i=0;i<G.players.length;i++){
    if(i!==pIdx)others.push(i);
  }
  if(others.length===0)return;
  const target=others[Math.floor(Math.random()*others.length)];
  G.players[target].frozenTurns=1;
  setMsg(`❄️ ¡${G.players[pIdx].name} congela a ${G.players[target].name}! Pierde su próximo turno`);

  // Falling snowflakes over frozen player's bar
  const bar=document.getElementById('playerBar');
  if(bar){
    const pbEls=bar.querySelectorAll('.pb');
    const targetPb=pbEls[target];
    if(targetPb){
      const rect=targetPb.getBoundingClientRect();
      for(let i=0;i<12;i++){
        const sf=document.createElement('div');
        sf.className='snowflake';
        sf.textContent='❄️';
        sf.style.position='fixed';
        sf.style.left=(rect.left+Math.random()*rect.width)+'px';
        sf.style.top=(rect.top-10)+'px';
        sf.style.animationDelay=(i*0.12)+'s';
        document.body.appendChild(sf);
        setTimeout(()=>sf.remove(),2200);
      }
    }
  }
}

async function doSteal(pIdx){
  // Find player with most territory (excluding current)
  let target=-1,maxTerr=0;
  for(let i=0;i<G.players.length;i++){
    if(i===pIdx)continue;
    if(G.players[i].terr>maxTerr){maxTerr=G.players[i].terr;target=i}
  }
  if(target<0)return;

  // Remove 3 random cells from their territory
  const theirCells=[];
  for(let r=0;r<G.rows;r++){
    for(let c=0;c<G.cols;c++){
      if(G.owner[r][c]===target)theirCells.push([r,c]);
    }
  }
  shuffle(theirCells);
  const toSteal=theirCells.slice(0,3);
  for(const[r,c]of toSteal){
    G.owner[r][c]=-1;
    const el=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if(el){
      const sw=document.createElement('div');
      sw.className='swipe';
      el.appendChild(sw);
      setTimeout(()=>sw.remove(),400);
    }
  }
  if(toSteal.length>0){
    setMsg(`⚡ ¡${G.players[pIdx].name} roba ${toSteal.length} casillas de ${G.players[target].name}!`);

    // Lightning flash overlay
    const flash=document.createElement('div');
    flash.className='lightning-flash';
    document.body.appendChild(flash);
    setTimeout(()=>flash.remove(),500);

    await sleep(600);
  }
}

function doDouble(pIdx){
  G.players[pIdx].doubleReady=true;
  setMsg(`🔄 ¡${G.players[pIdx].name} activa Doble! Su próxima captura vale x2`);

  // Trigger re-render so double-active class appears on player bar
  renderPlayerBar();
}

// ===================== TURN =====================
function startTurn(){
  if(G.over)return;
  const p=G.players[G.curP];
  updateTerritory();
  renderPlayerBar();

  // Check if player is frozen — skip turn
  if(p.frozenTurns>0){
    p.frozenTurns--;
    renderPicker(p);
    setMsg(`❄️ ${p.name} está congelado! Pierde este turno`);
    setTimeout(()=>{
      if(G.over)return;
      G.curP=(G.curP+1)%G.players.length;
      renderAll();
      startTurn();
    },1500);
    return;
  }

  renderPicker(p);
  setMsg(`🎯 ${p.name}: elige un color para inundar`);
  if(p.type!=='human')setTimeout(aiTurn,600);
}

function chooseColor(color){
  if(G.animating||G.over)return;
  const p=G.players[G.curP];
  if(p.type!=='human')return;
  processTurn(color);
}

async function processTurn(color){
  G.animating=true;
  const p=G.curP;
  const player=G.players[p];
  const res=doCapture(G.owner,p,color);
  G.turns++;

  // Apply double multiplier for display
  let displayN=res.n;
  if(player.doubleReady&&res.n>0){
    displayN=res.n*2;
    player.doubleReady=false;
  }

  // Track total captured (for end screen scoring)
  player.totalCaptured+=res.n;

  // Wave-by-wave animation
  if(res.waves&&res.waves.length>0){
    for(let w=0;w<res.waves.length;w++){
      const wave=res.waves[w];
      for(const[r,c]of wave){
        const el=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
        if(el){el.classList.add('capturing')}
      }
      renderBoard();
      updateTerritory();
      renderPlayerBar();
      await sleep(200);
    }
  }

  if(res.n>0){
    if(displayN>player.big)player.big=displayN;
    showScorePop(res.list[0],displayN,player.color);
    const bonusText=displayN!==res.n?` (×2 = ${displayN})`:'';
    setMsg(`🌊 +${res.n}${bonusText} casillas para ${player.name} (${COLOR_NAMES[color]})`);
  }else{
    setMsg(`💨 ${player.name} eligió ${COLOR_NAMES[color]} pero no capturó nada`);
  }
  await sleep(500);

  // Process captured power-ups
  if(res.powerups.length>0){
    await processPowerups(p,res.powerups);
    renderBoard();
    updateTerritory();
    renderPlayerBar();
    await sleep(400);
  }

  // avanzar / terminar
  if(res.n===0){G.stall++}else{G.stall=0}

  const unclaimed=countUnclaimed();
  G.curP=(G.curP+1)%G.players.length;
  G.animating=false;
  if(unclaimed===0||G.stall>=G.players.length){endGame();return}
  renderAll();
  startTurn();
}

function countUnclaimed(){
  let n=0;
  for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++)if(G.owner[r][c]===-1&&G.cellType[r][c]!=='wall')n++;
  return n;
}

function countPlayable(){
  return G.rows*G.cols-G.wallCount;
}

function updateTerritory(){
  G.players.forEach(p=>p.terr=0);
  for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++)if(G.owner[r][c]>=0)G.players[G.owner[r][c]].terr++;
}

// ===================== AI =====================
function aiTurn(){
  const pType=G.players[G.curP].type;
  const colors=[...Array(G.colors).keys()];
  let pick;
  if(pType==='easy'){
    pick=colors[Math.floor(Math.random()*colors.length)];
  }else if(pType==='medium'){
    // codicioso: color que captura más
    let best=-1,bestN=-1;
    for(const c of colors){
      const o=cloneOwner();const n=doCapture(o,G.curP,c).n;
      if(n>bestN){bestN=n;best=c}
    }
    pick=best;
  }else{
    // difícil: lookahead 1 (yo + mejor respuesta mía siguiente)
    let best=-1,bestVal=-Infinity;
    for(const c of colors){
      const o=cloneOwner();const n1=doCapture(o,G.curP,c).n;
      // mejor segunda jugada desde ese estado
      let n2=0;
      for(const c2 of colors){const oo=cloneOf(o);const nn=doCapture(oo,G.curP,c2).n;if(nn>n2)n2=nn}
      const val=n1+0.6*n2;
      if(val>bestVal){bestVal=val;best=c}
    }
    pick=best;
  }
  // llamar directo a processTurn (chooseColor filtra humanos)
  processTurn(pick);
}

function cloneOwner(){return G.owner.map(r=>[...r])}
function cloneOf(o){return o.map(r=>[...r])}

// ===================== RENDER =====================
function renderAll(){
  renderBoard();renderPlayerBar();renderTurnBadge();
  document.getElementById('turnCount').textContent=`Turno ${G.turns+1}`;
}

function renderBoard(){
  const board=document.getElementById('board');
  board.style.gridTemplateColumns=`repeat(${G.cols},30px)`;
  let html='';
  for(let r=0;r<G.rows;r++){
    for(let c=0;c<G.cols;c++){
      const own=G.owner[r][c];
      const ct=G.cellType[r][c];
      const puT=G.powerupType[r][c];

      if(ct==='wall'){
        html+=`<div class="cell wall" data-r="${r}" data-c="${c}"></div>`;
        continue;
      }

      const bg=own>=0?PCOL[own]:PALETTE[G.grid[r][c]];
      const cornerCls=own>=0&&isCorner(r,c,own)?' corner':'';

      if(ct==='powerup'&&puT&&own<0){
        const glowColor=PU_GLOW[puT]||'#fff';
        html+=`<div class="cell powerup${cornerCls}" data-r="${r}" data-c="${c}" style="background:${bg};--pu-glow:${glowColor}"><span class="pu-icon">${PU_EMOJI[puT]||'?'}</span></div>`;
      }else{
        html+=`<div class="cell${cornerCls}" data-r="${r}" data-c="${c}" style="background:${bg}"></div>`;
      }
    }
  }
  board.innerHTML=html;

  // Apply power-up glow borders via inline style (CSS custom property)
  document.querySelectorAll('.cell.powerup').forEach(el=>{
    const glow=el.style.getPropertyValue('--pu-glow');
    if(glow){
      el.querySelector(':scope')?.style.setProperty('--pu-glow',glow);
      // Apply via the ::before pseudo element using a style injection
      const r=el.dataset.r,c=el.dataset.c;
      const puT=G.powerupType[r]?.[c];
      if(puT){
        el.style.boxShadow=`0 0 6px ${PU_GLOW[puT]||'#fff'}40`;
        el.style.border=`1px solid ${PU_GLOW[puT]||'#fff'}80`;
      }
    }
  });
}

function isCorner(r,c,p){
  const[nr,nc]=corner(p);
  return r===nr&&c===nc;
}

function renderPicker(p){
  const pick=document.getElementById('picker');
  let html='';
  for(let c=0;c<G.colors;c++){
    const disabled=p.type!=='human';
    html+=`<button class="pbtn" style="background:${PALETTE[c]}" onclick="chooseColor(${c})" ${disabled?'disabled':''} title="${COLOR_NAMES[c]}"></button>`;
  }
  pick.innerHTML=html;
}

function renderPlayerBar(){
  const bar=document.getElementById('playerBar');
  const total=countPlayable();
  bar.innerHTML=G.players.map((p,i)=>{
    const isCur=i===G.curP&&!G.over;
    const pct=Math.round(p.terr/total*100);
    let effects='';
    if(p.frozenTurns>0)effects+=`<span class="pb-effects">❄️</span>`;
    if(p.doubleReady)effects+=`<span class="pb-effects">⚡</span>`;
    const frozenCls=p.frozenTurns>0?' frozen':'';
    const doubleCls=p.doubleReady?' double-active':'';
    return`<div class="pb ${isCur?'current':''}${frozenCls}${doubleCls}" style="color:${p.color};border-color:${p.color};background:${isCur?p.color+'22':'transparent'}">${p.name}<span class="pb-score">${p.terr}</span><span class="pct">${pct}%</span>${effects}</div>`;
  }).join('');
}

function renderTurnBadge(){
  const p=G.players[G.curP];
  const tb=document.getElementById('turnBadge');
  tb.textContent=`Turno: ${p.name}`;
  tb.style.color=p.color;
  tb.style.background=p.color+'22';
  tb.style.border=`2px solid ${p.color}`;
}

function showScorePop(cell,n,color){
  const el=document.querySelector(`.cell[data-r="${cell[0]}"][data-c="${cell[1]}"]`);
  if(!el)return;
  const rect=el.getBoundingClientRect();
  const pop=document.createElement('div');
  pop.className='score-pop';
  pop.textContent=`+${n}`;
  pop.style.left=rect.left+rect.width/2-20+'px';
  pop.style.top=rect.top+'px';
  pop.style.color=color;
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),800);
}

// ===================== END =====================
function endGame(){
  G.over=true;showS('end');
  updateTerritory();
  // Use totalCaptured for ranking (includes bomb bonus)
  const sorted=[...G.players].sort((a,b)=>b.totalCaptured!==a.totalCaptured?b.totalCaptured-a.totalCaptured:b.big-a.big);
  const medals=['🥇','🥈','🥉','4️⃣'];
  const playable=countPlayable();
  document.getElementById('endRank').innerHTML=sorted.map((p,i)=>`<div class="end-rank ${i===0?'w':''}"><span class="er-pos">${medals[i]}</span><span class="er-name" style="color:${p.color}">${p.name}</span><span class="er-score">${p.totalCaptured} casillas (${Math.round(p.totalCaptured/playable*100)}%)</span><div style="font-size:.7em;color:var(--dim)">Mejor jugada:+${p.big}</div></div>`).join('');
}
